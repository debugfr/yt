<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BerryTube</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <!-- Load libcurl for Wisp support -->
  <script src="https://cdn.jsdelivr.net/npm/@mercuryworkshop/libcurl.js@0.4.0/dist/libcurl.js"></script>
</head>
<body>
  <header class="header">
    <h1 class="logo" onclick="showSearch()">BerryTube</h1>
    <form id="search-form" class="search-bar">
      <input id="search-input" type="search" placeholder="Search YouTube without ads..." required />
      <button type="submit">Search</button>
    </form>
  </header>

  <main>
    <section id="search-view" class="view active">
      <div id="video-grid" class="video-grid">
        <p class="hint">Search for something to start watching.</p>
      </div>
    </section>

    <section id="watch-view" class="view">
      <button class="back-btn" onclick="showSearch()">← Back to search</button>
      <div class="player-container">
        <video id="video-player" controls autoplay playsinline></video>
      </div>
      <div class="video-info">
        <h1 id="video-title">Loading...</h1>
        <div class="video-meta">
          <strong id="channel-name">...</strong>
          <span id="video-views">0 views</span>
          <span id="video-likes">👍 0</span>
          <span id="video-dislikes">👎 0</span>
        </div>
      </div>
      <div class="comments-section">
        <h3>Comments</h3>
        <div id="comments-list"></div>
        <button id="load-more-comments" class="load-more" hidden>Load more comments</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>

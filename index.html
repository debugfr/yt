      </a>
    </div>
    <div class="header-center">
      <form id="search-form" class="search-box">
        <div class="search-input-wrapper">
          <input id="search-input" type="search" placeholder="Search" required />
        </div>
        <button type="submit" class="search-btn"><svg viewBox="0 0 24 24"><path d="M20.87 20.17l-5.59-5.59C16.35 13.35 17 11.75 17 10c0-3.87-3.13-7-7-7s-7 3.13-7 7 3.13 7 7 7c1.75 0 3.35-.65 4.58-1.71l5.59 5.59.7-.71zM10 16c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"></path></svg></button>
      </form>
      <button class="icon-btn mic-btn"><svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"></path></svg></button>
    </div>
    <div class="header-right">
      <button class="icon-btn"><svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4zM14 13h-3v3H9v-3H6v-2h3V8h2v3h3v2z"></path></svg></button>
      <button class="icon-btn"><svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"></path></svg></button>
      <div class="profile-avatar"></div>
    </div>
  </header>

  <div class="app-layout">
    <!-- SIDEBAR -->
    <aside class="sidebar">
      <a href="#" class="sidebar-item active" onclick="showHome(); return false;">
        <svg viewBox="0 0 24 24"><path d="M4 10v11h6v-6h4v6h6V10L12 3z"></path></svg> Home
      </a>
      <a href="#" class="sidebar-item">
        <svg viewBox="0 0 24 24"><path d="M10 14.65v-5.3L15 12l-5 2.65zm7.77-4.33c-.77-.32-1.2-.5-1.2-.5L12 3.35l-6.57 5.97s-.43.18-1.2.5C3.12 10.23 3 11.13 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-.87-.12-1.77-.23-1.68z"></path></svg> Shorts
      </a>
      <a href="#" class="sidebar-item">
        <svg viewBox="0 0 24 24"><path d="M20 7H4V6h16v1zm2 2v10H2V9h20zm-2 8V11H4v6h16zM6 13h5v2H6z"></path></svg> Subscriptions
      </a>
      <hr class="sidebar-divider">
      <a href="#" class="sidebar-item">
        <svg viewBox="0 0 24 24"><path d="M11 7l6 5-6 5V7z"></path><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"></circle></svg> You
      </a>
      <a href="#" class="sidebar-item">
        <svg viewBox="0 0 24 24"><path d="M14.97 16.95 10 13.87V7h2v5.76l4.03 2.49-1.06 1.7zM12 3c-4.96 0-9 4.04-9 9s4.04 9 9 9 9-4.04 9-9-4.04-9-9-9m0-1c5.52 0 10 4.48 10 10s-4.48 10-10 10S2 17.52 2 12 6.48 2 12 2z"></path></svg> History
      </a>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <!-- SEARCH VIEW -->
      <section id="search-view" class="view active">
        <div id="video-grid" class="video-grid">
          <div class="empty-state"><h2>Welcome to BerryTube</h2><p>Search for something to start watching.</p></div>
        </div>
      </section>

      <!-- WATCH VIEW -->
      <section id="watch-view" class="view">
        <div class="watch-layout">
          <div class="player-container">
            <video id="video-player" controls autoplay playsinline></video>
          </div>
          
          <h1 id="video-title" class="watch-title">Loading...</h1>
          
          <div class="watch-meta">
            <div class="channel-row">
              <div class="channel-avatar"></div>
              <div class="channel-text">
                <strong id="channel-name">...</strong>
                <span id="channel-subs">...</span>
              </div>
              <button class="subscribe-btn">Subscribe</button>
            </div>
            
            <div class="action-row">
              <div class="like-dislike-pill">
                <button class="pill-btn" id="video-likes">
                  <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"></path></svg> <span>0</span>
                </button>
                <div class="pill-divider"></div>
                <button class="pill-btn" id="video-dislikes">
                  <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.36-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"></path></svg>
                </button>
              </div>
              <button class="action-btn">Share</button>
              <button class="action-btn">Download</button>
            </div>
          </div>

          <div class="description-box">
            <div class="desc-meta">
              <strong id="video-views">0 views</strong>
              <span id="video-date">Just now</span>
            </div>
            <p id="video-desc">No description provided.</p>
          </div>

          <div class="comments-section">
            <div class="comments-header"><h3 id="comments-count">0 Comments</h3></div>
            <div class="comment-input-row">
              <div class="channel-avatar"></div>
              <input type="text" placeholder="Add a comment..." class="comment-input" />
            </div>
            <div id="comments-list" class="comments-list"></div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
